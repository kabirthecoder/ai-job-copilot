services:
  - type: web
    name: roleforge
    runtime: node
    rootDir: roleforge
    buildCommand: npm install && npm run build
    startCommand: npm run start
    autoDeploy: true
    envVars:
      - key: ROLEFORGE_PROVIDER
        value: openai
      - key: ROLEFORGE_OPENAI_MODEL
        value: gpt-5.4-mini
      - key: ROLEFORGE_AGENT_TIMEOUT_MS
        value: "20000"
